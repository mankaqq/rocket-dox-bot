<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROCKET DOX — КИБЕРПАНК</title>
    <style>
        /* ========== ГЛОБАЛЬНЫЙ СТИЛЬ ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        body {
            background: #0a0a0f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Share Tech Mono', monospace;
            overflow: hidden;
        }

        /* ========== АНИМИРОВАННЫЙ ФОН ========== */
        .matrix-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(179, 0, 255, 0.05) 0%, transparent 60%),
                linear-gradient(180deg, #0a0a0f 0%, #0d0d1a 50%, #0a0a0f 100%);
        }

        .matrix-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 65, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 65, 0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }

        /* ========== ГЛАВНАЯ КАРТОЧКА ========== */
        .terminal {
            position: relative;
            z-index: 1;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 65, 0.2);
            border-radius: 16px;
            padding: 40px 50px;
            max-width: 500px;
            width: 100%;
            box-shadow: 
                0 0 40px rgba(0, 255, 65, 0.05),
                inset 0 0 40px rgba(0, 255, 65, 0.02);
            animation: terminalPulse 3s ease-in-out infinite;
        }

        @keyframes terminalPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(0, 255, 65, 0.05); }
            50% { box-shadow: 0 0 60px rgba(0, 255, 65, 0.1); }
        }

        /* ========== ВЕРХНЯЯ ЛИНИЯ ========== */
        .terminal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(0, 255, 65, 0.15);
            margin-bottom: 25px;
        }

        .terminal-title {
            font-family: 'Orbitron', monospace;
            font-weight: 700;
            font-size: 14px;
            color: #00ff41;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
        }

        .terminal-dots {
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: dotBlink 1.5s ease-in-out infinite;
        }

        .dot:nth-child(1) { background: #ff0044; animation-delay: 0s; }
        .dot:nth-child(2) { background: #ff9900; animation-delay: 0.5s; }
        .dot:nth-child(3) { background: #00ff41; animation-delay: 1s; }

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* ========== ЛОГОТИП ========== */
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 60px;
            display: block;
            margin-bottom: 10px;
            animation: glitchText 3s infinite;
        }

        .logo-text {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: 28px;
            letter-spacing: 6px;
            background: linear-gradient(135deg, #00ff41, #00d4ff, #b300ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
        }

        .logo-sub {
            font-size: 12px;
            color: rgba(0, 255, 65, 0.4);
            letter-spacing: 8px;
            margin-top: 5px;
        }

        /* ========== ЭФФЕКТ ГЛИТЧА ========== */
        @keyframes glitchText {
            0%, 100% { transform: translate(0, 0); opacity: 1; }
            20% { transform: translate(-2px, 1px); opacity: 0.8; }
            40% { transform: translate(2px, -1px); opacity: 0.9; }
            60% { transform: translate(-1px, 2px); opacity: 0.8; }
            80% { transform: translate(1px, -2px); opacity: 0.9; }
        }

        /* ========== КНОПКИ ========== */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 25px 0;
        }

        .menu-btn {
            background: rgba(0, 255, 65, 0.05);
            border: 1px solid rgba(0, 255, 65, 0.15);
            border-radius: 10px;
            padding: 16px 12px;
            color: #e0e0e0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .menu-btn:hover {
            background: rgba(0, 255, 65, 0.12);
            border-color: #00ff41;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
            transform: scale(1.02);
        }

        .menu-btn:active {
            transform: scale(0.97);
        }

        .menu-btn .icon {
            display: block;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .menu-btn .label {
            font-size: 11px;
            opacity: 0.7;
        }

        /* ========== СПЕЦИАЛЬНЫЕ КНОПКИ ========== */
        .btn-dox {
            border-color: rgba(0, 212, 255, 0.3);
        }
        .btn-dox:hover {
            border-color: #00d4ff;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.15);
        }

        .btn-user {
            border-color: rgba(179, 0, 255, 0.3);
        }
        .btn-user:hover {
            border-color: #b300ff;
            box-shadow: 0 0 30px rgba(179, 0, 255, 0.15);
        }

        .btn-admin {
            border-color: rgba(255, 0, 68, 0.2);
            grid-column: span 2;
        }
        .btn-admin:hover {
            border-color: #ff0044;
            box-shadow: 0 0 30px rgba(255, 0, 68, 0.1);
        }

        .btn-full {
            grid-column: span 2;
        }

        /* ========== СТАТУСНАЯ СТРОКА ========== */
        .status-bar {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(0, 255, 65, 0.08);
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: rgba(0, 255, 65, 0.3);
            letter-spacing: 2px;
        }

        .status-bar .active {
            color: #00ff41;
            animation: scanline 2s linear infinite;
        }

        @keyframes scanline {
            0% { opacity: 0.3; }
            50% { opacity: 1; }
            100% { opacity: 0.3; }
        }

        /* ========== СКРОЛЛ-ЭФФЕКТ ========== */
        .scanline-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 999;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 3px,
                rgba(0, 255, 65, 0.02) 3px,
                rgba(0, 255, 65, 0.02) 4px
            );
            animation: scanMove 8s linear infinite;
        }

        @keyframes scanMove {
            0% { background-position: 0 0; }
            100% { background-position: 0 100%; }
        }

        /* ========== АДАПТИВ ========== */
        @media (max-width: 480px) {
            .terminal {
                padding: 25px 20px;
                margin: 15px;
            }
            .logo-text {
                font-size: 20px;
                letter-spacing: 3px;
            }
            .menu-grid {
                gap: 8px;
            }
            .menu-btn {
                padding: 12px 8px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== АНИМИРОВАННЫЙ ФОН ===== -->
    <div class="matrix-bg"></div>
    <div class="scanline-overlay"></div>

    <!-- ===== ТЕРМИНАЛ ===== -->
    <div class="terminal">

        <!-- ===== ВЕРХНЯЯ ЛИНИЯ ===== -->
        <div class="terminal-header">
            <span class="terminal-title">◆ ROCKET v2.0</span>
            <div class="terminal-dots">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>

        <!-- ===== ЛОГОТИП ===== -->
        <div class="logo-section">
            <span class="logo-icon">🚀</span>
            <div class="logo-text">ROCKET</div>
            <div class="logo-sub">◆ DOX ◆ CYBER ◆ OSINT ◆</div>
        </div>

        <!-- ===== МЕНЮ ===== -->
        <div class="menu-grid">
            <button class="menu-btn" onclick="sendCommand('/start')">
                <span class="icon">🏠</span>
                <span class="label">СТАРТ</span>
            </button>
            <button class="menu-btn" onclick="sendCommand('/help')">
                <span class="icon">📋</span>
                <span class="label">КОМАНДЫ</span>
            </button>
            <button class="menu-btn btn-dox" onclick="sendCommand('/dox')">
                <span class="icon">🔍</span>
                <span class="label">DOX</span>
            </button>
            <button class="menu-btn btn-user" onclick="sendCommand('/user')">
                <span class="icon">👤</span>
                <span class="label">USER</span>
            </button>
            <button class="menu-btn btn-admin btn-full" onclick="sendCommand('/admin')">
                <span class="icon">👑</span>
                <span class="label">АДМИН-ПАНЕЛЬ</span>
            </button>
        </div>

        <!-- ===== СТАТУС ===== -->
        <div class="status-bar">
            <span>⚡ <span class="active">SYSTEM ONLINE</span></span>
            <span>◆ 30+ SOURCES ◆</span>
            <span>🛡️ <span id="statusTime">00:00:00</span></span>
        </div>

    </div>

    <script>
        // ===== ВРЕМЯ В СТАТУСЕ =====
        function updateTime() {
            const now = new Date();
            document.getElementById('statusTime').textContent = now.toTimeString().slice(0,8);
        }
        setInterval(updateTime, 1000);
        updateTime();

        // ===== ОБРАБОТКА КНОПОК =====
        function sendCommand(cmd) {
            // В реальном боте здесь будет вызов Telegram WebApp
            console.log(`📩 Команда: ${cmd}`);
            alert(`🚀 Команда "${cmd}" отправлена в бот!`);
            
            // Для Telegram WebApp:
            // Telegram.WebApp.sendData(cmd);
        }

        // ===== ЭФФЕКТ ПРИ ЗАГРУЗКЕ =====
        document.addEventListener('DOMContentLoaded', () => {
            console.log('🚀 ROCKET DOX — КИБЕРПАНК ИНТЕРФЕЙС АКТИВИРОВАН');
        });
    </script>
</body>
</html>
